name: Build MONSDA containers

on:
  pull_request_target:
    types: [closed]
  release:
    types: [published]
  # Gate container builds on the test suite: this fires once "MONSDA CI"
  # finishes for a tag push (tags trigger its pypi-publish job too), so
  # containers are only built/pushed after tests pass.
  workflow_run:
    workflows: ["MONSDA CI"]
    types: [completed]
  workflow_dispatch:
  # Allows build-monsda-container.yml to build just the "monsda" environment
  # once it is available on bioconda, without waiting for a new release.
  workflow_call:
    inputs:
      environment:
        description: "Single environment to build, bypassing the default skip list"
        required: false
        type: string
      revision:
        description: "Git ref/sha to build from"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.event_name }}-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: >-
            ${{ inputs.revision
                || (github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha)
                || (github.event_name == 'release' && github.event.release.tag_name)
                || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha)
                || github.sha }}
      - id: matrix
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -n "$ENVIRONMENT" ]; then
            echo "matrix={\"environment\":[\"${ENVIRONMENT}\"]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(python scripts/container_matrix.py)" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        run: python scripts/container_matrix.py --version >> "$GITHUB_OUTPUT"
      - id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          build-args: |
            ENVIRONMENT=${{ matrix.environment }}
            MONSDA_VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ needs.prepare.outputs.revision }}
          tags: ghcr.io/jfallmann/monsda:${{ matrix.environment }}-${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.environment }}

  # Push each image as a single-layer SIF OCI artifact under the SAME tag.
  # Modern apptainer (>= 1.3) requires oras:// targets to be single-layer SIF
  # artifacts and refuses multi-layer docker images with "ORAS SIF image
  # should have a single layer, found N". A registry tag can only point to
  # one manifest, so this REPLACES the docker image at the tag: oras:// pulls
  # (what MONSDA workflows use) keep working, docker:// pulls of the tag do
  # not anymore.
  sif:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ACTOR: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install apptainer
        run: |
          sudo add-apt-repository -yn ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
      - name: Convert image to SIF and push to the same tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          apptainer registry login -u "$ACTOR" -p "$TOKEN" oras://ghcr.io
          export APPTAINER_DOCKER_USERNAME="$ACTOR"
          export APPTAINER_DOCKER_PASSWORD="$TOKEN"
          tag="ghcr.io/jfallmann/monsda:${ENVIRONMENT}-${VERSION}"
          apptainer pull -F --disable-cache "${ENVIRONMENT}-${VERSION}.sif" "docker://${tag}"
          apptainer push "${ENVIRONMENT}-${VERSION}.sif" "oras://${tag}"

  verify:
    needs: [prepare, sif]
    runs-on: ubuntu-latest
    env:
      ACTOR: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install apptainer
        run: |
          sudo add-apt-repository -yn ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          apptainer registry login -u "$ACTOR" -p "$TOKEN" oras://ghcr.io
          for environment in $(echo "$MATRIX" | python -c 'import json,sys; print(" ".join(json.load(sys.stdin)["environment"]))'); do
            apptainer pull -F --disable-cache "verify-${environment}.sif" "oras://ghcr.io/jfallmann/monsda:${environment}-${VERSION}"
          done
