name: Build monsda container once on bioconda

# The "monsda" environment (envs/monsda.yaml) pins the monsda conda package
# itself, so its container can only be built once bioconda has built the
# recipe for the released version. That bioconda build happens in a separate
# repository (bioconda-recipes) outside our control, so this polls for it
# instead of being triggered directly.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (default: latest published release)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: build-monsda-container
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      revision: ${{ steps.decide.outputs.revision }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$(gh release view --json tagName -q .tagName -R "${{ github.repository }}" 2>/dev/null || true)}"
          if [ -z "$tag" ]; then
            echo "No published release found, nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            published_at=$(gh release view "$tag" --json publishedAt -q .publishedAt -R "${{ github.repository }}")
            within_window=$(python - "$published_at" <<'PY'
          from datetime import datetime, timedelta, timezone
          import sys

          published = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          print(datetime.now(timezone.utc) - published <= timedelta(hours=48))
          PY
            )
            if [ "$within_window" = "False" ]; then
              echo "Release $tag is more than 48 hours old; stopping scheduled checks."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          revision=$(git rev-list -n 1 "$tag")
          git checkout --quiet "$revision"
          version=$(python scripts/container_matrix.py --version | cut -d= -f2)
          echo "Latest release is $tag (monsda version $version)"

          if docker manifest inspect "ghcr.io/jfallmann/monsda:monsda-${version}" >/dev/null 2>&1; then
            echo "ghcr.io/jfallmann/monsda:monsda-${version} already exists, nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl -fsS "https://api.anaconda.org/package/bioconda/monsda" \
               | python -c 'import json,sys; print("\n".join(f["version"] for f in json.load(sys.stdin)["files"]))' \
               | grep -qx "$version"; then
            echo "bioconda does not have monsda==$version yet, nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "monsda==$version is on bioconda, triggering the container build."
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build-containers.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      environment: monsda
      revision: ${{ needs.check.outputs.revision }}
